<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホームページ制作 ご提案 ｜ 株式会社G-field 様</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F0EB; font-family: 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', sans-serif; color: #1A1A1A; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const RED    = "#C84830";
    const DARK   = "#1A1A1A";
    const BASE   = "#F5F0EB";
    const GOLD   = "#D4A84B";
    const GRAY   = "#888";
    const BORDER = "#DDD8D2";

    // ── SVGアイコン ──────────────────────────────────────────────────
    const icons = {
      CalendarDays: "M8 2v4 M16 2v4 M3 10h18 M3 6h18a0 0 0 0 1 2 0v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z M8 14h.01 M12 14h.01 M16 14h.01 M8 18h.01 M12 18h.01",
      Megaphone:    "M3 11l19-9-9 19-2-8-8-2z",
      Scissors:     "M6 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6z M18 21a3 3 0 1 1 0-6 3 3 0 0 1 0 6z M20 4 8.12 15.88 M14.47 14.48 20 20 M8.12 8.12 12 12",
      Recycle:      "M7 19H4.815a1.83 1.83 0 0 1-1.57-2.763L7.196 9.5 M11 19h8.203a1.83 1.83 0 0 0 1.556-2.752l-4.252-7.534 M18 13l2-5-5 .5 M6.5 9.5 4 14.5l5-.5",
      User:         "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
      MapPin:       "M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z M12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
      Building2:    "M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18 M2 22h20 M12 6h.01 M12 10h.01 M12 14h.01 M12 18h.01",
      Github:       "M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22",
      Server:       "M2 3h20v6H2z M2 15h20v6H2z M6 9v.01 M6 15v.01",
      Link:         "M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71 M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71",
      CheckCircle2: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M9 12l2 2 4-4",
      ChevronDown:  "M6 9l6 6 6-6",
      ArrowRight:   "M5 12h14 M12 5l7 7-7 7",
      ExternalLink: "M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3",
    };
    const LucideIcon = ({ name, size = 16, color = "currentColor", style = {} }) => {
      const d = icons[name]; if (!d) return null;
      const paths = d.split(" M ").map((p, i) => i === 0 ? p : "M " + p);
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ display:"inline-block", flexShrink:0, verticalAlign:"middle", ...style }}>
          {paths.map((p, i) => <path key={i} d={p} />)}
        </svg>
      );
    };

    // ── モックサイトプレビュー ───────────────────────────────────────
    function SiteMockup() {
      const tabs = ["TOP", "事業内容", "会社概要", "お問い合わせ"];
      const [active, setActive] = useState("TOP");

      const businessItems = [
        { icon: "CalendarDays", title: "イベント事業",  sub: "筑豊ラーメンフェス・メダカフェス" },
        { icon: "Megaphone",    title: "SNS事業",      sub: "インフルエンサー育成・マッチング" },
        { icon: "Scissors",     title: "人材育成事業",  sub: "筑豊きっとカット運営" },
        { icon: "Recycle",      title: "リサイクル事業",sub: "不用品回収・リサイクル" },
      ];

      const panels = {
        "TOP": (
          <div style={{ background: `linear-gradient(135deg, ${RED} 0%, #8B2010 100%)`, color:"#fff", padding:"32px 24px", minHeight:220, display:"flex", flexDirection:"column", justifyContent:"center" }}>
            <div style={{ fontSize:10, letterSpacing:3, opacity:0.7, marginBottom:8, textTransform:"uppercase" }}>G-field</div>
            <div style={{ fontSize:22, fontWeight:700, lineHeight:1.4, marginBottom:10 }}>地方に、可能性を。<br />若者に、未来を。</div>
            <div style={{ fontSize:10, opacity:0.75, marginBottom:20, lineHeight:1.8 }}>現役オートレーサーが率いる地域創生カンパニー</div>
            <div style={{ display:"flex", gap:8 }}>
              <div style={{ background:"#fff", color:RED, padding:"7px 14px", borderRadius:2, fontSize:10, fontWeight:700 }}>事業内容を見る</div>
              <div style={{ border:"1px solid rgba(255,255,255,0.5)", color:"#fff", padding:"7px 14px", borderRadius:2, fontSize:10 }}>お問い合わせ</div>
            </div>
          </div>
        ),
        "事業内容": (
          <div style={{ padding:"20px", minHeight:220 }}>
            <div style={{ fontSize:9, color:RED, fontWeight:700, letterSpacing:3, marginBottom:6, textTransform:"uppercase" }}>Business</div>
            <div style={{ fontSize:15, fontWeight:700, color:DARK, marginBottom:12, borderBottom:`2px solid ${DARK}`, paddingBottom:6 }}>事業内容</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
              {businessItems.map(({ icon, title, sub }) => (
                <div key={title} style={{ border:`1px solid ${BORDER}`, borderRadius:2, padding:"10px", background:"#fff", borderLeft:`3px solid ${RED}` }}>
                  <div style={{ marginBottom:6 }}><LucideIcon name={icon} size={16} color={RED} /></div>
                  <div style={{ fontSize:11, fontWeight:700, color:DARK, marginBottom:2 }}>{title}</div>
                  <div style={{ fontSize:9, color:GRAY, lineHeight:1.5 }}>{sub}</div>
                </div>
              ))}
            </div>
          </div>
        ),
        "会社概要": (
          <div style={{ padding:"20px", minHeight:220 }}>
            <div style={{ fontSize:9, color:RED, fontWeight:700, letterSpacing:3, marginBottom:6, textTransform:"uppercase" }}>About</div>
            <div style={{ fontSize:15, fontWeight:700, color:DARK, marginBottom:12, borderBottom:`2px solid ${DARK}`, paddingBottom:6 }}>会社概要</div>
            <div style={{ display:"flex", gap:12, alignItems:"flex-start", marginBottom:12 }}>
              <div style={{ width:48, height:48, borderRadius:2, background:"#EDE8E3", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <LucideIcon name="User" size={22} color={RED} />
              </div>
              <div>
                <div style={{ fontSize:11, fontWeight:700, marginBottom:2 }}>代表　永畑 ○○</div>
                <div style={{ fontSize:10, color:GRAY, lineHeight:1.7 }}>現役オートレーサーとして活動しながら、地域の可能性を広げるべく起業。多角的な事業を展開しています。</div>
              </div>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
              {[["MapPin","所在地","福岡県"],["Building2","設立","2020年"],["CalendarDays","事業数","4分野"]].map(([ic,k,v])=>(
                <div key={k} style={{ background:"#EDE8E3", borderRadius:2, padding:"8px", textAlign:"center" }}>
                  <div style={{ marginBottom:2 }}><LucideIcon name={ic} size={11} color={GRAY} /></div>
                  <div style={{ fontSize:8, color:GRAY, marginBottom:1 }}>{k}</div>
                  <div style={{ fontSize:11, fontWeight:700, color:RED }}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        ),
        "お問い合わせ": (
          <div style={{ padding:"20px", minHeight:220, background:"#EDE8E3" }}>
            <div style={{ fontSize:9, color:RED, fontWeight:700, letterSpacing:3, marginBottom:6, textTransform:"uppercase" }}>Contact</div>
            <div style={{ fontSize:15, fontWeight:700, color:DARK, marginBottom:12, borderBottom:`2px solid ${DARK}`, paddingBottom:6 }}>お問い合わせ</div>
            <div style={{ background:"#fff", borderRadius:2, padding:"14px", border:`1px solid ${BORDER}` }}>
              {[["お名前","例：山田 太郎"],["メールアドレス","example@email.com"]].map(([lbl,ph])=>(
                <div key={lbl} style={{ marginBottom:8 }}>
                  <div style={{ fontSize:9, color:GRAY, marginBottom:3 }}>{lbl}</div>
                  <div style={{ background:"#F5F0EB", borderRadius:2, padding:"6px 8px", fontSize:10, color:"#bbb", border:`1px solid ${BORDER}` }}>{ph}</div>
                </div>
              ))}
              <div style={{ marginBottom:10 }}>
                <div style={{ fontSize:9, color:GRAY, marginBottom:3 }}>お問い合わせ内容</div>
                <div style={{ background:"#F5F0EB", borderRadius:2, padding:"6px 8px", fontSize:10, color:"#bbb", height:36, border:`1px solid ${BORDER}` }}>ご自由にどうぞ</div>
              </div>
              <div style={{ background:RED, color:"#fff", padding:"7px", borderRadius:2, textAlign:"center", fontSize:10, fontWeight:700 }}>送信する</div>
            </div>
          </div>
        ),
      };

      return (
        <div style={{ border:`1px solid ${BORDER}`, borderRadius:4, overflow:"hidden", boxShadow:"0 4px 20px rgba(0,0,0,0.08)" }}>
          <div style={{ background:"#E8E3DD", padding:"7px 12px", display:"flex", alignItems:"center", gap:8, borderBottom:`1px solid ${BORDER}` }}>
            <div style={{ display:"flex", gap:5 }}>
              {["#ff5f57","#febc2e","#28c840"].map(c=><div key={c} style={{ width:9, height:9, borderRadius:"50%", background:c }} />)}
            </div>
            <div style={{ flex:1, background:"#fff", borderRadius:3, padding:"3px 10px", fontSize:9, color:GRAY, border:`1px solid ${BORDER}` }}>g-field.jp</div>
          </div>
          <div style={{ background:"#fff", borderBottom:`1px solid ${BORDER}`, display:"flex", padding:"0 12px" }}>
            {tabs.map(s=>(
              <button key={s} onClick={()=>setActive(s)} style={{ padding:"8px 10px", fontSize:9, fontWeight:active===s?700:400, color:active===s?RED:GRAY, borderBottom:active===s?`2px solid ${RED}`:"2px solid transparent", background:"none", border:"none" }}>
                {s}
              </button>
            ))}
            <div style={{ marginLeft:"auto", display:"flex", alignItems:"center" }}>
              <div style={{ background:RED, color:"#fff", padding:"3px 8px", borderRadius:2, fontSize:8, fontWeight:700 }}>お問い合わせ</div>
            </div>
          </div>
          {panels[active]}
          <div style={{ background:DARK, color:"#666", padding:"8px 14px", fontSize:8, textAlign:"center" }}>
            © 2025 株式会社G-field　｜　<span style={{ color:"#888" }}>プライバシーポリシー</span>
          </div>
        </div>
      );
    }

    // ── 構成図 ───────────────────────────────────────────────────────
    function StructureChart() {
      const sections = [
        { label:"FV",     desc:"社名・キャッチコピー・画像・CTA",    color:RED },
        { label:"事業内容", desc:"4事業の紹介カード",               color:"#A83828" },
        { label:"会社概要", desc:"代表メッセージ・会社情報",          color:"#7A2818" },
        { label:"お問い合わせ", desc:"問い合わせフォーム・SNSリンク", color:DARK },
      ];
      return (
        <div style={{ border:`1px solid ${BORDER}`, borderRadius:4, overflow:"hidden" }}>
          <div style={{ background:"#EDE8E3", padding:"7px 14px", fontSize:10, color:GRAY, borderBottom:`1px solid ${BORDER}`, fontWeight:600 }}>
            g-field.jp　（1ページ構成・スクロールで全セクションを表示）
          </div>
          {sections.map((s,i)=>(
            <div key={s.label} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", background:i%2===0?"#fff":"#FAF7F4", borderBottom:i<sections.length-1?`1px solid ${BORDER}`:"none" }}>
              <div style={{ background:s.color, color:"#fff", borderRadius:2, padding:"3px 8px", fontSize:9, fontWeight:700, minWidth:72, textAlign:"center" }}>{s.label}</div>
              <div style={{ fontSize:11, color:"#444" }}>{s.desc}</div>
              {i<sections.length-1 && <div style={{ marginLeft:"auto" }}><LucideIcon name="ChevronDown" size={13} color="#ccc" /></div>}
            </div>
          ))}
          <div style={{ display:"flex", borderTop:`1px solid ${BORDER}` }}>
            {["プライバシーポリシー","特定商取引法 等"].map((label,i)=>(
              <div key={label} style={{ flex:1, padding:"7px 14px", background:i===0?"#F5F0F8":"#fff", borderLeft:i>0?`1px solid ${BORDER}`:"none" }}>
                <div style={{ fontSize:8, color:"#bbb", marginBottom:1 }}>下層ページ（別ページ）</div>
                <div style={{ fontSize:9, color:"#9a8aaa", fontWeight:600 }}>{label}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── インフラ構成図 ───────────────────────────────────────────────
    function InfraChart() {
      const items = [
        { icon:"User",   label:"G-field さま",     sub:"GitHubアカウント\nCloudflareアカウント\nドメイン登録",            border:RED,   bg:"#FDF0ED" },
        { icon:"Github", label:"GitHub",           sub:"コード管理\n優.bentoをCollaborator招待\n離脱時は招待削除のみ",    border:"#444",bg:"#F5F5F5" },
        { icon:"Server", label:"Cloudflare Pages", sub:"ホスティング（無料）\nGitHub連携で自動デプロイ\nCDN・HTTPS込み",  border:GOLD,  bg:"#FDF8ED" },
        { icon:"Link",   label:"ドメイン",          sub:"Cloudflare Registrar\nDNS管理も同一画面\n年額 約1,500〜2,000円", border:"#888",bg:"#F5F5F5" },
      ];
      return (
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {items.map(({ icon, label, sub, border, bg })=>(
              <div key={label} style={{ border:`1.5px solid ${border}`, borderRadius:4, padding:"12px 14px", background:bg }}>
                <LucideIcon name={icon} size={18} color={border} style={{ marginBottom:6 }} />
                <div style={{ fontSize:12, fontWeight:700, color:DARK, marginBottom:4 }}>{label}</div>
                <div style={{ fontSize:10, color:"#555", lineHeight:1.7, whiteSpace:"pre-line" }}>{sub}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop:10, background:"#EDE8E3", borderRadius:4, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, fontSize:10, color:"#555" }}>
            <LucideIcon name="ArrowRight" size={13} color={GRAY} />
            <span><strong style={{ color:DARK }}>デプロイの流れ：</strong>　優.bento がコードを更新 → GitHub にプッシュ → Cloudflare Pages が自動でサイトを更新（数十秒）</span>
          </div>
        </div>
      );
    }

    // ── 共通部品 ─────────────────────────────────────────────────────
    function Section({ title, eyebrow, children }) {
      return (
        <div style={{ marginBottom:44 }}>
          {eyebrow && <div style={{ fontSize:9, fontWeight:700, color:RED, letterSpacing:3, marginBottom:6, textTransform:"uppercase" }}>{eyebrow}</div>}
          <div style={{ fontSize:17, fontWeight:700, color:DARK, marginBottom:16, paddingBottom:10, borderBottom:`2px solid ${DARK}` }}>{title}</div>
          {children}
        </div>
      );
    }

    function Tag({ children, color=RED }) {
      return <span style={{ display:"inline-block", background:color, color:"#fff", borderRadius:2, padding:"2px 8px", fontSize:9, fontWeight:700, marginRight:4 }}>{children}</span>;
    }

    function PriceCard({ title, price, sub, note, tag, tagColor, highlight }) {
      return (
        <div style={{ border:highlight?`2px solid ${RED}`:`1px solid ${BORDER}`, borderRadius:4, padding:"16px 18px", background:highlight?"#FDF0ED":"#fff", flex:1, position:"relative" }}>
          {highlight && <div style={{ position:"absolute", top:-10, left:14, background:RED, color:"#fff", fontSize:8, fontWeight:700, padding:"2px 10px", borderRadius:10 }}>おすすめ</div>}
          {tag && <Tag color={tagColor||RED}>{tag}</Tag>}
          <div style={{ fontSize:13, fontWeight:700, color:DARK, marginTop:8, marginBottom:4 }}>{title}</div>
          <div style={{ fontSize:22, fontWeight:700, color:RED, marginBottom:4 }}>{price}</div>
          <div style={{ fontSize:10, color:GRAY, marginBottom:8 }}>{sub}</div>
          {note && <div style={{ fontSize:9, color:GRAY, background:"#F5F0EB", borderRadius:2, padding:"6px 10px", lineHeight:1.7, whiteSpace:"pre-line" }}>{note}</div>}
        </div>
      );
    }

    // ── メイン ───────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState("standard");

      return (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"40px 24px", lineHeight:1.6 }}>

          {/* ヘッダー */}
          <div style={{ marginBottom:40, paddingBottom:20, borderBottom:`3px solid ${RED}` }}>
            <div style={{ fontSize:10, color:GRAY, marginBottom:6, letterSpacing:1 }}>ホームページ制作　ご提案</div>
            <div style={{ fontSize:26, fontWeight:700, color:RED, marginBottom:6 }}>株式会社G-field 様</div>
            <div style={{ fontSize:11, color:GRAY }}>提案者：優.bento　　提案日：2026年6月15日</div>
          </div>

          {/* 1. おすすめ構成 */}
          <Section eyebrow="Structure" title="1. おすすめ構成">
            <p style={{ fontSize:12, color:"#555", marginBottom:14, lineHeight:1.8 }}>
              初見で会社そのものを強く印象付けるような情報に絞って見せ、次いで優先度の高い情報から配置する構成です。タブを切り替えて各セクションのイメージを確認いただけます。
            </p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6, marginBottom:16 }}>
              {[
                ["1","FV","社名・キャッチコピー・画像・CTA"],
                ["2","事業内容","4事業の紹介"],
                ["3","会社概要","代表・会社情報"],
                ["4","お問い合わせ","フォーム・SNS"],
              ].map(([n,label,desc])=>(
                <div key={n} style={{ background:"#fff", border:`1px solid ${BORDER}`, borderTop:`3px solid ${RED}`, borderRadius:2, padding:"10px 10px 12px" }}>
                  <div style={{ fontSize:9, color:RED, fontWeight:700, marginBottom:4 }}>0{n}</div>
                  <div style={{ fontSize:11, fontWeight:700, color:DARK, marginBottom:4 }}>{label}</div>
                  <div style={{ fontSize:9, color:GRAY, lineHeight:1.5 }}>{desc}</div>
                </div>
              ))}
            </div>
            <SiteMockup />
            <div style={{ marginTop:8, marginBottom:10, padding:"8px 12px", background:"#EDE8E3", borderRadius:2, fontSize:10, color:GRAY, lineHeight:1.7 }}>
              ※ 上記はあくまで構成イメージです。実際にはこの情報構造をもとにデザインいたします。
            </div>
            <StructureChart />
          </Section>

          {/* 2. デザインの方向性 */}
          <Section eyebrow="Design" title="2. デザインの方向性">
            <p style={{ fontSize:12, color:"#555", marginBottom:16, lineHeight:1.8 }}>
              理念である「人と人をつなぎ、挑戦を応援し、地域に新たな価値を創造すること」を感じさせる配色・素材・演出に落とし込みます。そのうえで整然と内容を配置し、企業としての信頼感も感じさせるデザインにします。
            </p>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
              <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"14px 16px" }}>
                <div style={{ fontSize:10, fontWeight:700, color:RED, marginBottom:8, letterSpacing:1 }}>CONCEPT</div>
                <div style={{ fontSize:11, color:"#444", lineHeight:1.8 }}>
                  名刺代わりのサイトとして、何より人柄や事業への想い・理念に直結する方向性で全体をまとめ、サブ要素として企業感や親しみやすさを調整します。
                </div>
              </div>
              <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"14px 16px" }}>
                <div style={{ fontSize:10, fontWeight:700, color:RED, marginBottom:8, letterSpacing:1 }}>LAYOUT</div>
                <div style={{ fontSize:11, color:"#444", lineHeight:1.8 }}>
                  直線・角ばったテクスチャ・要素の整然とした配列で信頼感を演出。余白を広くとり、情報を詰め込みすぎない構成にします。
                </div>
              </div>
            </div>
            {/* カラーパレット */}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:11, fontWeight:700, color:DARK, marginBottom:10 }}>カラーパレット</div>
              <div style={{ display:"flex", gap:0, border:`1px solid ${BORDER}`, borderRadius:4, overflow:"hidden" }}>
                {[
                  { name:"Main",  color:"#C84830", hex:"#C84830", label:"勢い・挑戦・応援",   light:false },
                  { name:"Dark",  color:"#8B2010", hex:"#8B2010", label:"重厚感・誠実さ",     light:false },
                  { name:"Base",  color:"#F5F0EB", hex:"#F5F0EB", label:"温かみ・地域感",     light:true  },
                  { name:"Gold",  color:"#D4A84B", hex:"#D4A84B", label:"アクセント（少量）",  light:false },
                  { name:"Text",  color:"#1A1A1A", hex:"#1A1A1A", label:"テキスト",           light:false },
                ].map(({ name, color, hex, label, light })=>(
                  <div key={name} style={{ flex:1, background:color, padding:"12px 8px" }}>
                    <div style={{ fontSize:8, fontWeight:700, color:light?GRAY:"rgba(255,255,255,0.6)", marginBottom:4 }}>{name}</div>
                    <div style={{ fontSize:9, color:light?"#555":"rgba(255,255,255,0.9)", fontWeight:600, marginBottom:2 }}>{hex}</div>
                    <div style={{ fontSize:8, color:light?GRAY:"rgba(255,255,255,0.65)", lineHeight:1.4 }}>{label}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"12px 16px", fontSize:11, color:"#555", lineHeight:1.8 }}>
              <strong style={{ color:DARK }}>写真素材について</strong><br />
              代表のお写真（レース中・オフ両方あると◎）やイベント現場の写真があると、サイトの印象が大きく変わります。ご用意が難しい場合はフリー素材で対応します。
            </div>
          </Section>

          {/* 3. 制作方法 */}
          <Section eyebrow="Method" title="3. 制作方法">
            <p style={{ fontSize:12, color:"#555", marginBottom:14, lineHeight:1.8 }}>
              今回の場合は<strong>静的 HTML / CSS / JavaScript</strong> で構築するのがベストと考えます。ページ数が少なく、日々更新するようなコンテンツではないとお見受けするためです。
            </p>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:14 }}>
              {[
                { label:"静的 HTML（推奨）", desc:"シンプル・高速・維持費ゼロ。今回のニーズに最適。", highlight:true },
                { label:"WordPress",       desc:"記事コンテンツを追加したい・ブログを強化したい場合に。", highlight:false },
                { label:"STUDIO",          desc:"デザイン含めてご自身で微調整したい場合に。", highlight:false },
              ].map(({ label, desc, highlight })=>(
                <div key={label} style={{ border:highlight?`2px solid ${RED}`:`1px solid ${BORDER}`, borderRadius:4, padding:"12px 14px", background:highlight?"#FDF0ED":"#fff", position:"relative" }}>
                  {highlight && <div style={{ position:"absolute", top:-9, left:12, background:RED, color:"#fff", fontSize:8, fontWeight:700, padding:"2px 8px", borderRadius:8 }}>今回はこちら</div>}
                  <div style={{ fontSize:11, fontWeight:700, color:DARK, marginBottom:6 }}>{label}</div>
                  <div style={{ fontSize:10, color:"#666", lineHeight:1.6 }}>{desc}</div>
                </div>
              ))}
            </div>
            <div style={{ background:"#EDE8E3", borderRadius:4, padding:"12px 16px", fontSize:11, color:"#555", lineHeight:1.8 }}>
              ホスティングは<strong style={{ color:DARK }}>Cloudflare Pages（無料）</strong>、コード管理は<strong style={{ color:DARK }}>GitHub</strong> を使用します。G-field さまのアカウントで運営するため、将来的な移管も自由です。
            </div>
            <div style={{ marginTop:14 }}>
              <InfraChart />
            </div>
          </Section>

          {/* 4. 制作費用 */}
          <Section eyebrow="Pricing" title="4. 制作費用">
            <div style={{ display:"flex", gap:0, marginBottom:20, border:`1px solid ${BORDER}`, borderRadius:4, overflow:"hidden" }}>
              {[["standard","スタンダードプラン"],["cms","管理画面ありプラン"]].map(([key,label])=>(
                <button key={key} onClick={()=>setTab(key)} style={{ flex:1, padding:"10px", fontSize:12, fontWeight:tab===key?700:400, background:tab===key?RED:"#fff", color:tab===key?"#fff":GRAY, border:"none", transition:"all 0.15s" }}>
                  {label}
                </button>
              ))}
            </div>

            {tab==="standard" && (
              <div>
                <div style={{ display:"flex", gap:12, marginBottom:16 }}>
                  <PriceCard title="制作費（初期）" price="30,000円〜" sub="税込・1ページ内完結の場合" tag="初期費用" highlight />
                  <PriceCard title="維持費（月額）" price="0円" sub="ホスティング・ドメイン除く" tag="月額" tagColor="#2A7A50"
                    note={"ホスティング（Cloudflare Pages）：無料\nドメイン年間更新：約1,500〜2,000円/年"} />
                </div>
                <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"14px 16px", fontSize:11, color:"#555", lineHeight:1.9 }}>
                  <div style={{ fontWeight:700, color:DARK, marginBottom:8 }}>制作費に含まれるもの</div>
                  {["デザイン・コーディング（1ページ完結構成）","お問い合わせフォーム設置・メール通知設定","ドメイン・ホスティング初期設定サポート","プライバシーポリシーページ","SEO基本設定（タイトル・メタ・OGP）","納品後の操作説明・引き継ぎドキュメント"].map(t=>(
                    <div key={t} style={{ display:"flex", gap:8, alignItems:"center", marginBottom:4 }}>
                      <LucideIcon name="CheckCircle2" size={13} color="#2A7A50" />
                      <span>{t}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab==="cms" && (
              <div>
                <div style={{ display:"flex", gap:12, marginBottom:16 }}>
                  <PriceCard title="制作費（初期）" price="50,000円〜" sub="税込・要相談" tag="初期費用" highlight />
                  <PriceCard title="維持費（月額）" price="0円" sub="ホスティング・ドメイン除く" tag="月額" tagColor="#2A7A50"
                    note={"ホスティング（Cloudflare Pages）：無料\nドメイン年間更新：約1,500〜2,000円/年"} />
                </div>
                <div style={{ background:"#FDF8ED", border:`1px solid ${GOLD}`, borderRadius:4, padding:"12px 16px", fontSize:11, color:"#555", lineHeight:1.7, marginBottom:12 }}>
                  <div style={{ fontWeight:700, color:"#8B6A10", marginBottom:4 }}>管理画面ありプランとは？</div>
                  ログイン画面からテキストや写真をGUIで変更できる管理機能を追加します。Gitなどの専門知識不要で、ブラウザから直接編集が可能になります。
                </div>
                <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"14px 16px", fontSize:11, color:"#555", lineHeight:1.9 }}>
                  <div style={{ fontWeight:700, color:DARK, marginBottom:8 }}>スタンダードプランの内容に加えて</div>
                  {["管理者ログイン機能","テキスト・写真の編集画面","お知らせ記事の投稿・削除"].map(t=>(
                    <div key={t} style={{ display:"flex", gap:8, alignItems:"center", marginBottom:4 }}>
                      <LucideIcon name="CheckCircle2" size={13} color={GOLD} />
                      <span>{t}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </Section>

          {/* 5. 維持管理費用 */}
          <Section eyebrow="Maintenance" title="5. 維持管理費用">
            <div style={{ display:"flex", gap:12 }}>
              <div style={{ flex:1, border:`1px solid ${BORDER}`, borderRadius:4, padding:"16px" }}>
                <div style={{ fontSize:10, fontWeight:700, color:DARK, marginBottom:4 }}>基本</div>
                <div style={{ fontSize:22, fontWeight:700, color:RED, marginBottom:4 }}>0円</div>
                <div style={{ fontSize:10, color:GRAY, lineHeight:1.6, marginBottom:10 }}>ホスティング・SSL・CDNすべて無料。</div>
                <div style={{ borderTop:`1px solid ${BORDER}`, paddingTop:10, fontSize:10, color:"#555", lineHeight:1.7 }}>
                  修正対応が必要な場合：<strong style={{ color:DARK }}>都度 3,000円〜</strong><br />
                  <span style={{ fontSize:9, color:GRAY }}>テキスト修正・写真差し替え等、作業量により変動</span>
                </div>
              </div>
              <div style={{ flex:1, border:`2px solid ${RED}`, borderRadius:4, padding:"16px", background:"#FDF0ED", position:"relative" }}>
                <div style={{ position:"absolute", top:-10, left:14, background:RED, color:"#fff", fontSize:8, fontWeight:700, padding:"2px 10px", borderRadius:10 }}>おすすめ</div>
                <div style={{ fontSize:10, fontWeight:700, color:DARK, marginBottom:4 }}>月額サポートプラン</div>
                <div style={{ fontSize:22, fontWeight:700, color:RED, marginBottom:4 }}>5,000円<span style={{ fontSize:12, fontWeight:400 }}>/月</span></div>
                <div style={{ fontSize:10, color:GRAY, lineHeight:1.6, marginBottom:10 }}>月2回までの修正対応を含みます。</div>
                <div style={{ borderTop:`1px solid #F0C0B0`, paddingTop:10, fontSize:10, color:"#555", lineHeight:1.7 }}>
                  急ぎの対応や小さな変更も気軽にご依頼いただけます。
                </div>
              </div>
            </div>
          </Section>

          {/* 6. 納期目安 */}
          <Section eyebrow="Schedule" title="6. 納期目安">
            <div style={{ background:"#fff", border:`1px solid ${BORDER}`, borderRadius:4, padding:"16px 20px", marginBottom:12, display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ fontSize:32, fontWeight:700, color:RED }}>約3週間</div>
              <div style={{ fontSize:11, color:GRAY, lineHeight:1.7 }}>素材のご提供が早いほど短縮できます。<br />写真・テキスト・会社情報のご用意をお願いします。</div>
            </div>
            <div style={{ position:"relative", paddingLeft:22 }}>
              <div style={{ position:"absolute", left:7, top:6, bottom:6, width:2, background:BORDER }} />
              {[
                ["STEP 1","ヒアリング・素材提供","写真・テキスト・会社情報をお送りいただきます"],
                ["STEP 2","デザイン確認","全体のデザインをご確認いただき、修正をお伝えください"],
                ["STEP 3","コーディング・実装","デザイン通りに制作します"],
                ["STEP 4","テスト・最終確認","実際のURLで確認いただき、最終調整を行います"],
                ["完了",  "本番公開・引き継ぎ","ドメイン設定・操作説明ドキュメントをお渡しします"],
              ].map(([step,title,desc],i)=>(
                <div key={i} style={{ display:"flex", gap:12, marginBottom:14, alignItems:"flex-start" }}>
                  <div style={{ width:14, height:14, borderRadius:"50%", background:i===4?RED:DARK, flexShrink:0, marginTop:3, zIndex:1, boxShadow:`0 0 0 2px ${BASE}, 0 0 0 3px ${i===4?RED:DARK}` }} />
                  <div>
                    <div style={{ display:"flex", gap:8, alignItems:"center", marginBottom:2 }}>
                      <span style={{ fontSize:9, color:RED, fontWeight:700 }}>{step}</span>
                      <span style={{ fontSize:12, fontWeight:700, color:DARK }}>{title}</span>
                    </div>
                    <div style={{ fontSize:10, color:GRAY }}>{desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </Section>

          {/* フッター */}
          <div style={{ borderTop:`2px solid ${DARK}`, paddingTop:20, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ fontSize:11, color:GRAY }}>
              ご不明な点はお気軽にお声がけください。<br />
              <strong style={{ color:DARK }}>優.bento</strong>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
